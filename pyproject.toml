[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["data", "models", "mlruns", ".venv"]

# 显式声明规则集，避免本地全局配置 / 不同 ruff 版本导致 CI 结果漂移
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
