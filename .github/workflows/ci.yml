name: CI Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black pytest httpx fastapi scikit-learn pandas

    - name: Check formatting with black
      run: black --check .

    - name: Lint with ruff
      run: ruff check .

    - name: Run tests with pytest
      run: pytest tests/ -v