name: CI

on:
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (static analysis)
        run: ruff check .

      - name: Black (formatting)
        run: black --check .

      - name: Pytest (full test suite)
        run: pytest -v

  docker-build:
    name: Build & Smoke-test Image
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ml-app:ci .

      - name: Start container
        run: docker run -d --name ml-app -p 8000:8000 ml-app:ci

      - name: Wait for /health and assert model loaded
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health -o /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"model_loaded":true' /tmp/health.json

      - name: Smoke-test /predict
        run: |
          curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"text":"A wonderful, brilliant film."}' -o /tmp/pred.json
          cat /tmp/pred.json
          grep -q '"sentiment"' /tmp/pred.json

      - name: Container logs (on failure)
        if: failure()
        run: docker logs ml-app || true
