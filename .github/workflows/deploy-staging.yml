name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  build-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate .env
        run: |
          echo "${{ secrets.STAGING_ENV_FILE }}" > .env
          
      - run: docker build -t ml-app:staging .